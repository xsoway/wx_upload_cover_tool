<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <title>公众号横版封面 · 霓虹 Neon</title>

  <style>
    /* ============================================================
       Cover Style 04 · 霓虹 Neon
       深黑底 + 霓虹绿/青 + 科技网格，适合开发者/极客/效率工具
       ============================================================ */
    :root {
      --bg: #0A0D0B;
      --text: #EAF6EF;
      --muted: rgba(234, 246, 239, 0.62);
      --neon-a: #34F5A3;
      --neon-b: #23E6D4;
      --grid: rgba(52, 245, 163, 0.10);
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
              "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050706;
      font-family: var(--font);
      color: var(--text);
    }

    .stage {
      width: 900px;
      height: 383px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(640px 320px at 30% 20%, rgba(52, 245, 163, 0.12), transparent 62%),
        radial-gradient(680px 340px at 80% 80%, rgba(35, 230, 212, 0.12), transparent 62%),
        var(--bg);
      box-shadow:
        0 30px 110px rgba(0, 0, 0, 0.7),
        0 14px 36px rgba(0, 0, 0, 0.5);
    }

    /* 科技网格 */
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.7), transparent 90%);
      pointer-events: none;
    }

    /* 左上发光角标（代码风格） */
    .codebar {
      position: absolute;
      top: 34px;
      left: 46px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--neon-b);
      user-select: none;
    }
    .codebar::before { content: "❯ "; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .content {
      position: relative;
      height: 100%;
      padding: 64px 76px 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .eyebrow {
      display: none;
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--neon-a);
      white-space: nowrap;
    }

    .title {
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.14;
      color: var(--text);
      text-shadow: 0 0 28px rgba(52, 245, 163, 0.45), 0 0 60px rgba(52, 245, 163, 0.2);
      max-width: 24ch;
    }

    .subtitle {
      margin: 6px 0 0;
      line-height: 1.5;
      color: var(--muted);
      max-width: 60ch;
    }

    #subtitle:empty { display: none; }

    .foot {
      position: absolute;
      left: 76px;
      right: 76px;
      bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(234, 246, 239, 0.4);
    }
    .foot .up { color: var(--neon-a); }

    /* 出图模式 */
    body.export {
      padding: 0 !important;
      min-height: auto !important;
      display: block !important;
      background: var(--bg) !important;
    }
    body.export .stage { margin: 0 !important; }
  </style>
</head>

<body>
<main class="stage">
  <div class="codebar">generate_cover<span class="blink">▌</span></div>
  <div class="content">
    <div id="eyebrow" class="eyebrow"></div>
    <h1 id="title" class="title"></h1>
    <p id="subtitle" class="subtitle"></p>
  </div>
  <div class="foot">
    <span>wx_cover · 900×383</span>
    <span class="up">▲ Neon Style</span>
  </div>
</main>

<script>
  const titleEl = document.getElementById("title");
  const eyebrowEl = document.getElementById("eyebrow");
  const subtitleEl = document.getElementById("subtitle");

  function splitEyebrow() {
    if (!titleEl || !eyebrowEl) return;
    const raw = (titleEl.textContent || "").trim();
    if (raw.startsWith("[") && raw.includes("]")) {
      const idx = raw.indexOf("]");
      eyebrowEl.textContent = raw.slice(0, idx + 1);
      eyebrowEl.style.display = "block";
      titleEl.textContent = raw.slice(idx + 1).trim();
    } else {
      eyebrowEl.textContent = "";
      eyebrowEl.style.display = "none";
    }
  }

  function fitTextToBox(el, { minPx, maxPx, stepPx, maxLines }) {
    if (!el) return;
    el.style.removeProperty("transform");
    el.style.removeProperty("transform-origin");
    const style = getComputedStyle(el);
    const original = parseFloat(style.fontSize);
    const targetWidth = el.clientWidth || el.getBoundingClientRect().width;
    const lineHeightRaw = parseFloat(style.lineHeight);
    const lineHeight = Number.isFinite(lineHeightRaw) ? lineHeightRaw : original * 1.25;
    const targetHeight = lineHeight * (maxLines || 2);
    let size = Math.min(Math.max(original, minPx), maxPx);
    el.style.fontSize = `${size}px`;
    for (let i = 0; i < 40; i++) {
      const tooWide = el.scrollWidth > targetWidth + 1;
      const tooTall = el.scrollHeight > targetHeight + 1;
      if (!tooWide && !tooTall) break;
      size -= stepPx;
      if (size <= minPx) { el.style.fontSize = `${minPx}px`; break; }
      el.style.fontSize = `${size}px`;
    }
  }

  function applyCoverRules() {
    splitEyebrow();
    if (subtitleEl) {
      const v = (subtitleEl.textContent || "").trim();
      subtitleEl.style.display = v ? "" : "none";
      if (v) fitTextToBox(subtitleEl, { minPx: 16, maxPx: 28, stepPx: 1, maxLines: 3 });
    }
    if (titleEl) {
      const v = (titleEl.textContent || "").trim();
      fitTextToBox(titleEl, { minPx: 34, maxPx: 70, stepPx: 1, maxLines: 2 });
    }
  }

  window.__coverAfterText__ = applyCoverRules;
  document.addEventListener("DOMContentLoaded", applyCoverRules);
</script>
</body>
</html>

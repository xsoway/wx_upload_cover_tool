<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <title>公众号横版封面 · 深空 Cosmic</title>

  <style>
    /* ============================================================
       Cover Style 02 · 深空 Cosmic
       深蓝紫渐变 + 星光点缀 + 发光文字，适合科技/前沿/宏观话题
       ============================================================ */
    :root {
      --bg-0: #0B1026;
      --bg-1: #1B1E3A;
      --text: #F4F6FF;
      --muted: rgba(244, 246, 255, 0.62);
      --accent-a: #7B8CFF;
      --accent-b: #4EE7D8;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
              "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070A18;
      font-family: var(--font);
      color: var(--text);
    }

    .stage {
      width: 900px;
      height: 383px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(720px 340px at 18% 12%, rgba(123, 140, 255, 0.30), transparent 64%),
        radial-gradient(760px 360px at 84% 82%, rgba(78, 231, 216, 0.22), transparent 62%),
        linear-gradient(135deg, var(--bg-0), var(--bg-1));
      box-shadow:
        0 32px 110px rgba(0, 0, 0, 0.6),
        0 14px 36px rgba(0, 0, 0, 0.4);
    }

    /* 星光 */
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 22%, rgba(255,255,255,0.6) 0 1px, transparent 2px) 0 0/90px 70px,
        radial-gradient(circle at 46% 34%, rgba(255,255,255,0.4) 0 1px, transparent 2px) 0 0/120px 110px,
        radial-gradient(circle at 78% 24%, rgba(255,255,255,0.5) 0 1px, transparent 2px) 0 0/100px 60px,
        radial-gradient(circle at 66% 72%, rgba(255,255,255,0.35) 0 1px, transparent 2px) 0 0/130px 90px;
      opacity: 0.32;
      pointer-events: none;
    }

    /* 底部渐变压暗，保证文字可读 */
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.0) 55%, rgba(4, 6, 18, 0.5) 100%);
      pointer-events: none;
    }

    .content {
      position: relative;
      height: 100%;
      padding: 56px 74px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .eyebrow {
      display: none;
      align-self: flex-start;
      padding: 5px 14px;
      border: 1px solid rgba(123, 140, 255, 0.5);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent-a);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .title {
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.12;
      color: var(--text);
      text-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      max-width: 26ch;
    }

    .subtitle {
      margin: 8px 0 0;
      line-height: 1.5;
      color: var(--muted);
      max-width: 62ch;
    }

    #subtitle:empty { display: none; }

    .foot {
      position: absolute;
      left: 74px;
      right: 74px;
      bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(244, 246, 255, 0.42);
      text-transform: uppercase;
    }
    .foot .dot {
      color: var(--accent-b);
    }

    /* 出图模式 */
    body.export {
      padding: 0 !important;
      min-height: auto !important;
      display: block !important;
      background: var(--bg-0) !important;
    }
    body.export .stage { margin: 0 !important; }
  </style>
</head>

<body>
<main class="stage">
  <div class="content">
    <div id="eyebrow" class="eyebrow"></div>
    <h1 id="title" class="title"></h1>
    <p id="subtitle" class="subtitle"></p>
  </div>
  <div class="foot">
    <span>微信公众号封面</span>
    <span class="dot">✦ Cosmic Style</span>
  </div>
</main>

<script>
  const titleEl = document.getElementById("title");
  const eyebrowEl = document.getElementById("eyebrow");
  const subtitleEl = document.getElementById("subtitle");

  function splitEyebrow() {
    if (!titleEl || !eyebrowEl) return;
    const raw = (titleEl.textContent || "").trim();
    if (raw.startsWith("[") && raw.includes("]")) {
      const idx = raw.indexOf("]");
      eyebrowEl.textContent = raw.slice(0, idx + 1);
      eyebrowEl.style.display = "block";
      titleEl.textContent = raw.slice(idx + 1).trim();
    } else {
      eyebrowEl.textContent = "";
      eyebrowEl.style.display = "none";
    }
  }

  function fitTextToBox(el, { minPx, maxPx, stepPx, maxLines }) {
    if (!el) return;
    el.style.removeProperty("transform");
    el.style.removeProperty("transform-origin");
    const style = getComputedStyle(el);
    const original = parseFloat(style.fontSize);
    const targetWidth = el.clientWidth || el.getBoundingClientRect().width;
    const lineHeightRaw = parseFloat(style.lineHeight);
    const lineHeight = Number.isFinite(lineHeightRaw) ? lineHeightRaw : original * 1.25;
    const targetHeight = lineHeight * (maxLines || 2);
    let size = Math.min(Math.max(original, minPx), maxPx);
    el.style.fontSize = `${size}px`;
    for (let i = 0; i < 40; i++) {
      const tooWide = el.scrollWidth > targetWidth + 1;
      const tooTall = el.scrollHeight > targetHeight + 1;
      if (!tooWide && !tooTall) break;
      size -= stepPx;
      if (size <= minPx) { el.style.fontSize = `${minPx}px`; break; }
      el.style.fontSize = `${size}px`;
    }
  }

  function applyCoverRules() {
    splitEyebrow();
    if (subtitleEl) {
      const v = (subtitleEl.textContent || "").trim();
      subtitleEl.style.display = v ? "" : "none";
      if (v) fitTextToBox(subtitleEl, { minPx: 16, maxPx: 28, stepPx: 1, maxLines: 3 });
    }
    if (titleEl) {
      const v = (titleEl.textContent || "").trim();
      fitTextToBox(titleEl, { minPx: 34, maxPx: 72, stepPx: 1, maxLines: 2 });
      if (v.length <= 6) { titleEl.style.transform = "scale(1.04)"; titleEl.style.transformOrigin = "left center"; }
    }
  }

  window.__coverAfterText__ = applyCoverRules;
  document.addEventListener("DOMContentLoaded", applyCoverRules);
</script>
</body>
</html>

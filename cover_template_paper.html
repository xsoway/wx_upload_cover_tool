<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <title>公众号横版封面 · 暖纸 Paper</title>

  <style>
    /* ============================================================
       Cover Style 03 · 暖纸 Paper
       暖米色纸张质感 + 深棕文字 + 琥珀点缀，适合人文/阅读/复盘
       ============================================================ */
    :root {
      --paper: #F5F0E4;
      --paper-deep: #EAE2CF;
      --ink: #2B2416;
      --text: #3F3626;
      --muted: #7A6F5A;
      --accent: #C98A2E;
      --rule: #D9CEB4;
      --font: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", Georgia,
              "PingFang SC", "Microsoft YaHei", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #DDD3BC;
      font-family: var(--font);
      color: var(--text);
    }

    .stage {
      width: 900px;
      height: 383px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 100% at 20% 0%, #FFFDF6 0%, var(--paper) 45%, var(--paper-deep) 100%);
      box-shadow:
        0 30px 90px rgba(90, 66, 30, 0.4),
        0 12px 28px rgba(90, 66, 30, 0.24),
        inset 0 0 0 1px rgba(255, 253, 247, 0.7);
    }

    /* 纸张纤维纹理 */
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 20%, rgba(120, 90, 40, 0.05) 0 1px, transparent 2px) 0 0/24px 22px,
        radial-gradient(circle at 70% 70%, rgba(120, 90, 40, 0.04) 0 1px, transparent 2px) 0 0/30px 30px;
      pointer-events: none;
    }

    /* 底部装饰横线 */
    .stage::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: linear-gradient(90deg, transparent, var(--accent) 20%, var(--accent) 80%, transparent);
      opacity: 0.55;
      pointer-events: none;
    }

    .content {
      position: relative;
      height: 100%;
      padding: 62px 78px 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .eyebrow {
      display: none;
      align-self: flex-start;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .title {
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--ink);
      max-width: 24ch;
    }
    .title::after {
      content: "";
      display: block;
      width: 64px;
      height: 3px;
      margin-top: 18px;
      background: linear-gradient(90deg, var(--accent), rgba(201, 138, 46, 0.2));
    }

    .subtitle {
      margin: 8px 0 0;
      line-height: 1.55;
      color: var(--muted);
      max-width: 60ch;
    }

    #subtitle:empty { display: none; }

    .foot {
      position: absolute;
      left: 78px;
      right: 78px;
      bottom: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .foot::before {
      content: "————";
      color: var(--rule);
      letter-spacing: 0.2em;
    }

    /* 出图模式 */
    body.export {
      padding: 0 !important;
      min-height: auto !important;
      display: block !important;
      background: linear-gradient(120deg, #FFFDF6, var(--paper-deep)) !important;
    }
    body.export .stage { margin: 0 !important; }
  </style>
</head>

<body>
<main class="stage">
  <div class="content">
    <div id="eyebrow" class="eyebrow"></div>
    <h1 id="title" class="title"></h1>
    <p id="subtitle" class="subtitle"></p>
  </div>
  <div class="foot">
    <span>微信公众号封面</span>
    <span>Paper Style</span>
  </div>
</main>

<script>
  const titleEl = document.getElementById("title");
  const eyebrowEl = document.getElementById("eyebrow");
  const subtitleEl = document.getElementById("subtitle");

  function splitEyebrow() {
    if (!titleEl || !eyebrowEl) return;
    const raw = (titleEl.textContent || "").trim();
    if (raw.startsWith("[") && raw.includes("]")) {
      const idx = raw.indexOf("]");
      eyebrowEl.textContent = raw.slice(0, idx + 1);
      eyebrowEl.style.display = "block";
      titleEl.textContent = raw.slice(idx + 1).trim();
    } else {
      eyebrowEl.textContent = "";
      eyebrowEl.style.display = "none";
    }
  }

  function fitTextToBox(el, { minPx, maxPx, stepPx, maxLines }) {
    if (!el) return;
    el.style.removeProperty("transform");
    el.style.removeProperty("transform-origin");
    const style = getComputedStyle(el);
    const original = parseFloat(style.fontSize);
    const targetWidth = el.clientWidth || el.getBoundingClientRect().width;
    const lineHeightRaw = parseFloat(style.lineHeight);
    const lineHeight = Number.isFinite(lineHeightRaw) ? lineHeightRaw : original * 1.25;
    const targetHeight = lineHeight * (maxLines || 2);
    let size = Math.min(Math.max(original, minPx), maxPx);
    el.style.fontSize = `${size}px`;
    for (let i = 0; i < 40; i++) {
      const tooWide = el.scrollWidth > targetWidth + 1;
      const tooTall = el.scrollHeight > targetHeight + 1;
      if (!tooWide && !tooTall) break;
      size -= stepPx;
      if (size <= minPx) { el.style.fontSize = `${minPx}px`; break; }
      el.style.fontSize = `${size}px`;
    }
  }

  function applyCoverRules() {
    splitEyebrow();
    if (subtitleEl) {
      const v = (subtitleEl.textContent || "").trim();
      subtitleEl.style.display = v ? "" : "none";
      if (v) fitTextToBox(subtitleEl, { minPx: 16, maxPx: 27, stepPx: 1, maxLines: 3 });
    }
    if (titleEl) {
      const v = (titleEl.textContent || "").trim();
      fitTextToBox(titleEl, { minPx: 34, maxPx: 66, stepPx: 1, maxLines: 2 });
    }
  }

  window.__coverAfterText__ = applyCoverRules;
  document.addEventListener("DOMContentLoaded", applyCoverRules);
</script>
</body>
</html>

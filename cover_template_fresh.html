<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <title>公众号横版封面 · 清新 Fresh</title>

  <style>
    /* ============================================================
       Cover Style 05 · 清新 Fresh
       明亮柔和的渐变底色 + 圆润大字 + 白色卡片，适合生活/泛内容
       ============================================================ */
    :root {
      --c1: #FFE8F0;
      --c2: #E4F0FF;
      --c3: #E7FBF3;
      --ink: #2C2A3A;
      --muted: #6B6A80;
      --accent: #FF7BAC;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
              "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ECEAFA;
      font-family: var(--font);
      color: var(--ink);
    }

    .stage {
      width: 900px;
      height: 383px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(700px 360px at 88% 10%, rgba(255, 123, 172, 0.35), transparent 62%),
        radial-gradient(700px 360px at 6% 96%, rgba(94, 173, 255, 0.35), transparent 62%),
        radial-gradient(600px 320px at 55% 50%, rgba(255, 226, 148, 0.25), transparent 60%),
        linear-gradient(120deg, var(--c1), var(--c2) 50%, var(--c3));
      border-radius: 28px;
      box-shadow:
        0 32px 90px rgba(90, 80, 140, 0.22),
        0 14px 34px rgba(90, 80, 140, 0.14);
    }

    /* 漂浮装饰圆 */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }
    .blob.b1 { width: 120px; height: 120px; top: -34px; right: 60px;
               background: rgba(255, 255, 255, 0.45); }
    .blob.b2 { width: 160px; height: 160px; bottom: -60px; left: -30px;
               background: rgba(255, 255, 255, 0.35); }

    .content {
      position: relative;
      height: 100%;
      padding: 58px 74px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .eyebrow {
      display: none;
      align-self: flex-start;
      padding: 5px 14px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--accent);
      white-space: nowrap;
    }

    .title {
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.14;
      color: var(--ink);
      max-width: 24ch;
    }

    .subtitle {
      margin: 8px 0 0;
      line-height: 1.5;
      color: var(--muted);
      max-width: 58ch;
    }

    #subtitle:empty { display: none; }

    .badge {
      position: absolute;
      top: 34px;
      right: 46px;
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: linear-gradient(135deg, #FF9FC0, #7BC8FF);
      box-shadow: 0 12px 28px rgba(255, 123, 172, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 22px;
    }

    .foot {
      position: absolute;
      left: 74px;
      right: 74px;
      bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--muted);
      opacity: 0.85;
    }

    /* 出图模式 */
    body.export {
      padding: 0 !important;
      min-height: auto !important;
      display: block !important;
      background: linear-gradient(120deg, var(--c1), var(--c2) 50%, var(--c3)) !important;
    }
    body.export .stage { margin: 0 !important; border-radius: 0 !important; }
  </style>
</head>

<body>
<main class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="badge">✦</div>
  <div class="content">
    <div id="eyebrow" class="eyebrow"></div>
    <h1 id="title" class="title"></h1>
    <p id="subtitle" class="subtitle"></p>
  </div>
  <div class="foot">
    <span>微信公众号封面</span>
    <span>Fresh Style</span>
  </div>
</main>

<script>
  const titleEl = document.getElementById("title");
  const eyebrowEl = document.getElementById("eyebrow");
  const subtitleEl = document.getElementById("subtitle");

  function splitEyebrow() {
    if (!titleEl || !eyebrowEl) return;
    const raw = (titleEl.textContent || "").trim();
    if (raw.startsWith("[") && raw.includes("]")) {
      const idx = raw.indexOf("]");
      eyebrowEl.textContent = raw.slice(0, idx + 1);
      eyebrowEl.style.display = "block";
      titleEl.textContent = raw.slice(idx + 1).trim();
    } else {
      eyebrowEl.textContent = "";
      eyebrowEl.style.display = "none";
    }
  }

  function fitTextToBox(el, { minPx, maxPx, stepPx, maxLines }) {
    if (!el) return;
    el.style.removeProperty("transform");
    el.style.removeProperty("transform-origin");
    const style = getComputedStyle(el);
    const original = parseFloat(style.fontSize);
    const targetWidth = el.clientWidth || el.getBoundingClientRect().width;
    const lineHeightRaw = parseFloat(style.lineHeight);
    const lineHeight = Number.isFinite(lineHeightRaw) ? lineHeightRaw : original * 1.25;
    const targetHeight = lineHeight * (maxLines || 2);
    let size = Math.min(Math.max(original, minPx), maxPx);
    el.style.fontSize = `${size}px`;
    for (let i = 0; i < 40; i++) {
      const tooWide = el.scrollWidth > targetWidth + 1;
      const tooTall = el.scrollHeight > targetHeight + 1;
      if (!tooWide && !tooTall) break;
      size -= stepPx;
      if (size <= minPx) { el.style.fontSize = `${minPx}px`; break; }
      el.style.fontSize = `${size}px`;
    }
  }

  function applyCoverRules() {
    splitEyebrow();
    if (subtitleEl) {
      const v = (subtitleEl.textContent || "").trim();
      subtitleEl.style.display = v ? "" : "none";
      if (v) fitTextToBox(subtitleEl, { minPx: 16, maxPx: 28, stepPx: 1, maxLines: 3 });
    }
    if (titleEl) {
      const v = (titleEl.textContent || "").trim();
      fitTextToBox(titleEl, { minPx: 34, maxPx: 72, stepPx: 1, maxLines: 2 });
    }
  }

  window.__coverAfterText__ = applyCoverRules;
  document.addEventListener("DOMContentLoaded", applyCoverRules);
</script>
</body>
</html>
